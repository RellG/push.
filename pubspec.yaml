name: push_app
description: Daily pushup tracker for Android, iOS, and web.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cloud_firestore: ^6.6.0
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.3
  lucide_icons: ^0.257.0
  path_provider: ^2.1.5
  sembast: ^3.8.5
  sembast_web: ^2.4.2
  shared_preferences: ^2.5.5

dev_dependencies:
  fake_cloud_firestore: ^4.1.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
